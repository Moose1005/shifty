name: ci
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0
      - run: zig build test
      - run: zig build run -- --name Moe --year 2026 --month 10 --in "samples/2026 Schedule (Oct).csv"
