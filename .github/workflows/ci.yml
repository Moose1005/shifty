name: ci
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL --retry 3 -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          tar -C /tmp -xf /tmp/zig.tar.xz
          echo "/tmp/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          echo "$pwd\zig-x86_64-windows-0.17.0" >> $env:GITHUB_PATH
      - run: zig version
      - run: zig build test
      - run: zig build
      - name: Run CLI (Linux)
        if: runner.os == 'Linux'
        run: ./zig-out/bin/shifty --name Moe --year 2026 --month 10 --in "samples/synthetic-oct-2026.csv"
      - name: Run CLI (Windows)
        if: runner.os == 'Windows'
        run: .\zig-out\bin\shifty.exe --name Moe --year 2026 --month 10 --in "samples/synthetic-oct-2026.csv"
